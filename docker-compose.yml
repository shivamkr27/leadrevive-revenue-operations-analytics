name: leadrevive
services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_DB: leadrevive
      POSTGRES_USER: leadrevive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_phase3.py first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadrevive -d leadrevive"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [local]
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_ENABLE_CHAOS: "true"
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - mailpit_data:/data
    networks: [local]
  n8n:
    image: n8nio/n8n:2.44.6
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/configure_phase3.py first}
      LEADREVIVE_WEBHOOK_SECRET: ${LEADREVIVE_WEBHOOK_SECRET:?Run scripts/configure_phase3.py first}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro
    networks: [local]
  backend:
    build: .
    volumes:
      - ./analytics/exports:/app/analytics/exports
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots:ro
      - ./data/synthetic:/app/data/synthetic:ro
    environment:
      DATABASE_URL: postgresql+psycopg://leadrevive:${POSTGRES_PASSWORD}@postgres:5432/leadrevive
      LEADREVIVE_WEBHOOK_SECRET: ${LEADREVIVE_WEBHOOK_SECRET}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_API_URL: http://mailpit:8025
      N8N_BASE_URL: http://n8n:5678
      DRY_RUN: "true"
      LIVE_EMAIL_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [local]
networks:
  local:
    driver: bridge
volumes:
  postgres_data:
  mailpit_data:
  n8n_data:
